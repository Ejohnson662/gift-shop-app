<script>

<script>
// PRINT — a cheap Bluetooth receipt printer (ESC/POS) from the phone, on browsers that have Web Bluetooth (Android Chrome).
(function () {
  if (!navigator.bluetooth) return;
  var device = null, characteristic = null;
  var SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', '0000ff00-0000-1000-8000-00805f9b34fb'];
  function connect() {
    if (characteristic) return Promise.resolve(characteristic);
    return navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SERVICES }).then(function (d) { device = d; return d.gatt.connect(); })
      .then(function (server) { return server.getPrimaryServices(); })
      .then(function (services) {
        var tries = services.map(function (s) { return function () { return s.getCharacteristics().then(function (cs) { var w = cs.filter(function (c) { return c.properties.write || c.properties.writeWithoutResponse; })[0]; if (!w) throw new Error('no writable characteristic'); return w; }); }; });
        var p = Promise.reject(new Error('start'));
        tries.forEach(function (t) { p = p.catch(t); });
        return p;
      })
      .then(function (c) { characteristic = c; if (device) device.addEventListener('gattserverdisconnected', function () { characteristic = null; }); return c; })
      .catch(function (e) { characteristic = null; throw new Error('Could not connect to a printer: ' + (e.message || e)); });
  }
  function bytes(text) {
    var out = [0x1b, 0x40]; // initialise
    var s = String(text).replace(/[^\x00-\x7f]/g, function (ch) { return ch === '×' ? 'x' : ch === '—' ? '-' : ch === '·' ? '-' : '?'; });
    for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
    out.push(0x0a, 0x0a, 0x0a, 0x0a, 0x1d, 0x56, 0x00); // feed and cut
    return new Uint8Array(out);
  }
  App.print = function (text) {
    return connect().then(function (c) {
      var data = bytes(text), chunk = 100, p = Promise.resolve();
      for (var i = 0; i < data.length; i += chunk) (function (slice) { p = p.then(function () { return c.properties.writeWithoutResponse ? c.writeValueWithoutResponse(slice) : c.writeValue(slice); }); })(data.slice(i, i + chunk));
      return p;
    });
  };
})();
</script>

<script>
// CLOSE — the end-of-day wizard: count the drawer, finish today's counts, note anything odd, done in three minutes.
App.screen({
  id: 'close', title: 'Close', order: 80,
  render: function (root) { root.innerHTML = '<div class="steps" id="close-steps"></div>'; },
  onShow: function () { this.refresh(); },
  refresh: function () {
    var self = this, box = App.$('close-steps'); box.innerHTML = '<p class="muted">Loading…</p>';
    App.call('api_closeStatus').then(function (st) {
      box.innerHTML = '';
      if (st.closed) { box.innerHTML = '<div class="step"><h3>Today is closed <span class="ok">✓</span></h3><p class="muted">Sales ' + App.money(st.salesToday) + '. See you tomorrow.</p></div>'; return; }
      var mk = function (title, body, done) { var d = document.createElement('div'); d.className = 'step'; d.innerHTML = '<h3><span></span><span class="ok"></span></h3>'; d.querySelector('h3 span').textContent = title; if (done) d.querySelector('.ok').textContent = '✓'; if (body) d.appendChild(body); box.appendChild(d); return d; };
      // 1 cash
      var cashBody = document.createElement('div'); var counted = null;
      if (st.cash.open) { cashBody.innerHTML = '<div class="muted">Drawer open since ' + st.cash.since + ' · expected ' + App.money(st.cash.expected) + '</div><div class="pin"><input type="number" id="cl-cash" placeholder="Cash counted $" inputmode="decimal"></div>'; }
      else cashBody.innerHTML = '<div class="muted">Drawer is closed.</div>';
      mk('1. Count the drawer', cashBody, !st.cash.open);
      // 2 counts
      var cb = document.createElement('div'); cb.innerHTML = '<div class="muted">' + st.cycle.done + ' of ' + st.cycle.total + " of today's counts done" + (st.cycle.remaining ? ' — <a class="link" href="#" id="cl-go-count">finish them</a>' : '') + '</div>';
      mk("2. Today's counts", cb, st.cycle.remaining === 0);
      var go = App.$('cl-go-count'); if (go) go.onclick = function (e) { e.preventDefault(); App.show('count'); };
      // 3 anything odd
      var nb = document.createElement('div'); nb.innerHTML = '<textarea id="cl-notes" placeholder="Anything odd today? Damaged stock, a complaint, something staff should know."></textarea><div class="chips" id="cl-inc"></div>';
      mk('3. Anything to note', nb, false);
      (st.incidentTypes || []).forEach(function (t) { var c = document.createElement('button'); c.className = 'chip'; c.textContent = '+ ' + t; c.onclick = function () { var note = prompt('What happened? (' + t + ')'); if (!note) return; if (!App.needPin()) return; App.call('api_incident', [App.pin, { type: t, note: note, who: App.staff }]).then(function () { App.toast('Logged'); }).catch(App.pinFailed); }; App.$('cl-inc').appendChild(c); });
      // 4 done
      var db = document.createElement('div'); db.innerHTML = '<div class="muted">Sales today ' + App.money(st.salesToday) + ' · this week ' + App.money(st.week) + (st.incidents ? ' · ' + st.incidents + ' incident(s) logged' : '') + '</div><button class="btn" id="cl-done" style="margin-top:8px">Close the day</button>';
      mk('4. Close', db, false);

        }).catch(function (e) { b.disabled = false; App.pinFailed(e); });
      };
    }).catch(function (e) { box.innerHTML = '<p class="muted">' + (e.message || e) + '</p>'; });
  }
});

  render: function (root) {
    root.innerHTML = '<h3 style="margin:4px 0 6px">Reset the shelf</h3><div id="shelf-secs"><p class="muted">Loading…</p></div>' +
      '<h3 style="margin:16px 0 6px">On hold</h3><div class="list holds" id="shelf-holds"></div><button class="btn ghost sm" id="shelf-hold" style="margin-top:8px">Hold an item for someone</button>' +
      '<h3 style="margin:16px 0 6px">Something wrong?</h3><button class="btn ghost sm" id="shelf-inc">Report an incident</button>';
    var self = this;
    App.$('shelf-hold').onclick = function () {
      var name = prompt('Item name or SKU'); if (!name) return;
      var it = App.items().filter(function (x) { return x.item.toLowerCase() === name.toLowerCase() || x.sku.toLowerCase() === name.toLowerCase(); })[0] || App.filtered(name)[0];
      if (!it) return App.toast('No item like that', true);
      var qty = Number(prompt('How many of ' + it.item + '?', '1')); if (!(qty > 0)) return;
      var who = prompt('For whom?'); if (!who) return;
      if (!App.needPin()) return;
      App.call('api_hold', [App.pin, { sku: it.sku, qty: qty, for: who, who: App.staff }]).then(function (r) { App.toast('Holding ' + r.qty + ' × ' + r.item + ' for ' + r.forWhom + ' until ' + r.until); App.load(); self.renderHolds(); }).catch(App.pinFailed);
    };
    App.$('shelf-inc').onclick = function () {
      App.choose('What happened?', ['breakage', 'damaged stock', 'customer complaint', 'theft suspected', 'spill', 'equipment', 'other'], null, function (t) {
        var note = prompt('Details (' + t + ')'); if (!note) return; if (!App.needPin()) return;
        App.call('api_incident', [App.pin, { type: t, note: note, who: App.staff }]).then(function () { App.toast('Logged. Thanks.'); }).catch(App.pinFailed);
      });
    };
  },
  onShow: function () { this.renderSections(); this.renderHolds(); },
  renderSections: function () {
    App.call('api_planogram').then(function (secs) {
      var box = App.$('shelf-secs'); box.innerHTML = '';
      if (!secs.length) { box.innerHTML = '<p class="muted">No shelf photos yet. A manager adds them on the Planogram tab of the sheet (section, photo, checklist).</p>'; return; }
      secs.forEach(function (s) {
        var d = document.createElement('div'); d.className = 'shelf-sec';
        d.innerHTML = '<b></b>' + (s.photo ? '<img alt="" loading="lazy">' : '') + '<div class="cl"></div>' + (s.notes ? '<div class="muted"></div>' : '');
        d.querySelector('b').textContent = s.section; if (s.photo) d.querySelector('img').src = s.photo; if (s.notes) d.querySelector('.muted').textContent = s.notes;
        s.checklist.forEach(function (c) { var l = document.createElement('label'); var cb = document.createElement('input'); cb.type = 'checkbox'; l.appendChild(cb); l.appendChild(document.createTextNode(c)); d.querySelector('.cl').appendChild(l); });
        box.appendChild(d);
      });
    }).catch(function (e) { App.$('shelf-secs').innerHTML = '<p class="muted">' + (e.message || e) + '</p>'; });
  },
  renderHolds: function () {
    var list = App.$('shelf-holds'); list.innerHTML = '';
    var holds = (App.data && App.data.holds) || [];
    if (!holds.length) { list.innerHTML = '<p class="muted">Nothing on hold.</p>'; return; }
    holds.forEach(function (h) {
      var d = document.createElement('div'); d.className = 'row'; d.innerHTML = '<div class="name"><b></b><span></span></div>';
      d.querySelector('b').textContent = h.qty + ' × ' + h.item; d.querySelector('span').textContent = 'for ' + h.forWhom + ' · until ' + h.until;
      ['sold', 'cancelled'].forEach(function (o) { var b = document.createElement('button'); b.className = 'btn ghost sm'; b.textContent = o === 'sold' ? 'Picked up' : 'Release'; b.onclick = function () { if (!App.needPin()) return; App.call('api_releaseHold', [App.pin, { sku: h.sku, for: h.forWhom, outcome: o }]).then(function () { App.toast(o === 'sold' ? 'Released — ring it up on Sell' : 'Released'); App.load().then(function () { App.show('shelf'); }); }).catch(App.pinFailed); }; d.appendChild(b); });
      list.appendChild(d);
    });
  }
});
App.mock.api_planogram = function () { return [{ section: 'Left wall — Maine-made food', photo: '', checklist: ['Jam front and centre', 'Syrup labels facing out', 'Whoopie pies restocked from the box under the shelf'], notes: '' }]; };
App.mock.api_hold = function (p, o) { return { sku: o.sku, item: o.sku, qty: o.qty, forWhom: o.for, until: '2026-09-15' }; };
App.mock.api_releaseHold = function () { return { released: true }; };
</script>

<!-- 88_ask.html -->
<style>
  .ask textarea { width:100%; min-height:72px; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:inherit; }
  .ask .answer { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; white-space:pre-wrap; margin-top:10px; line-height:1.45; }
  .ask .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
</style>
<script>
// ASK — plain-English questions about the shop, answered by Claude from the sheet's own numbers. Also writes product copy.
App.screen({
  id: 'ask', title: 'Ask', order: 88,
  render: function (root) {
    var self = this;
    root.innerHTML = '<div class="ask"><div id="ask-off" class="muted" hidden>Claude is not connected yet. A manager connects it from the sheet: Shop menu → Connect Claude.</div>' +
      '<textarea id="ask-q" placeholder="Ask anything about the shop: what should I reorder before the weekend? which maker is owed the most? what sold best on rainy days?"></textarea>' +
      '<div class="chips" id="ask-chips"></div><button class="btn" id="ask-go">Ask</button><div id="ask-out"></div>' +
      '<h3 style="margin:18px 0 6px">Product copy</h3><p class="muted">A listing description, a social caption and hashtags for one item. Saved to the online store.</p>' +
      '<div style="display:flex;gap:8px"><input type="text" id="ask-item" placeholder="Item name or SKU" list="ask-items" style="flex:1"><button class="btn sm" id="ask-write">Write</button></div><datalist id="ask-items"></datalist><div id="ask-copy"></div></div>';
    ['What should I reorder this week?', 'Which maker is owed the most?', 'What did we sell yesterday?', 'Which items have not sold in 60 days?'].forEach(function (q) { var b = document.createElement('button'); b.className = 'chip'; b.textContent = q; b.onclick = function () { App.$('ask-q').value = q; self.ask(); }; App.$('ask-chips').appendChild(b); });
    App.$('ask-go').onclick = function () { self.ask(); };
    App.$('ask-write').onclick = function () { self.write(); };
    App.$('ask-q').onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); self.ask(); } };
  },
  onData: function (d) {
    App.$('ask-off').hidden = d.claude !== false;
    var dl = App.$('ask-items'); if (dl) { dl.innerHTML = ''; (d.items || []).forEach(function (i) { var o = document.createElement('option'); o.value = i.item; dl.appendChild(o); }); }
  },
  ask: function () {
    var q = App.$('ask-q').value.trim(); if (!q) return;
    if (!App.needPin()) return;
    var out = App.$('ask-out'), b = App.$('ask-go'); b.disabled = true; b.textContent = 'Thinking…';
    var box = document.createElement('div'); box.className = 'answer'; box.textContent = 'Reading the sheet…'; out.insertBefore(box, out.firstChild);
    App.call('api_ask', [App.pin, q, App.staff]).then(function (r) { box.textContent = ''; var qq = document.createElement('div'); qq.className = 'muted'; qq.textContent = q; var a = document.createElement('div'); a.textContent = r.answer; box.appendChild(qq); box.appendChild(a); App.$('ask-q').value = ''; })
      .catch(function (e) { box.textContent = e.message || String(e); box.style.color = 'var(--bad)'; App.pinFailed(e); })
      .then(function () { b.disabled = false; b.textContent = 'Ask'; });
  },
  write: function () {
    var name = App.$('ask-item').value.trim(); if (!name) return;
    var hit = App.filtered(name)[0]; if (!hit) return App.toast('No item matches', true);
    if (!App.needPin()) return;
    var b = App.$('ask-write'); b.disabled = true; b.textContent = 'Writing…';
    App.call('api_describe', [App.pin, hit.sku, true]).then(function (r) {
      var el = App.$('ask-copy'); el.innerHTML = '';
      var box = document.createElement('div'); box.className = 'answer';
      var h = document.createElement('b'); h.textContent = r.item; box.appendChild(h);
      var d = document.createElement('div'); d.textContent = r.description; d.style.marginTop = '6px'; box.appendChild(d);
      var c = document.createElement('div'); c.className = 'muted'; c.style.marginTop = '8px'; c.textContent = r.caption + (r.hashtags.length ? '\n' + r.hashtags.map(function (t) { return '#' + t; }).join(' ') : ''); box.appendChild(c);
      var copy = document.createElement('button'); copy.className = 'btn ghost sm'; copy.style.marginTop = '8px'; copy.textContent = 'Copy caption'; copy.onclick = function () { var t = r.caption + '\n\n' + r.hashtags.map(function (x) { return '#' + x; }).join(' '); if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { App.toast('Copied'); }); else prompt('Copy this', t); }; box.appendChild(copy);
      el.appendChild(box); App.toast('Description saved to the online store');
    }).catch(function (e) { App.pinFailed(e); }).then(function () { b.disabled = false; b.textContent = 'Write'; });
  }
});
App.mock.api_ask = function (p, q) { return { answer: 'Reorder the blueberry jam (4 left, sells 6 a week) and the balsam pillows (out). Everything else covers the weekend.', model: 'mock' }; };
App.mock.api_describe = function (p, sku) { return { sku: sku, item: 'Wild blueberry jam 8oz', description: 'Small-batch jam made from wild Maine blueberries, cooked down with not much else. Bright, not too sweet, and the jar empties faster than you expect.', caption: 'Wild blueberries, one small kitchen in Union, and a jar that never lasts the week.', hashtags: ['maine', 'wildblueberry', 'unionmaine', 'smallbatch', 'giftshop'], model: 'mock' }; };
</script>

<!-- 90_help.html -->
<style>
  .help details { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:0 14px; margin-bottom:8px; }
  .help summary { min-height:48px; display:flex; align-items:center; font-weight:700; cursor:pointer; }
  .help p { margin:0 0 12px; }
</style>
<script>
// HELP — the "how do I…" cards, so nobody has to phone the owner.
App.screen({
  id: 'help', title: 'Help', order: 95,
  render: function (root) {
    var cards = [
      ['Ring up a sale', 'Tap Sell, tap the items (tap again for more, or use − and +). Pick Card, Cash or Split, then Charge. The receipt buttons appear after.'],
      ['Undo a mistake', 'Right after a sale, tap Undo on the green message (30 seconds). Later than that, use Refund — that needs the manager PIN.'],
      ['Take a discount', 'In the basket, tap a line for 10% / 20% / $1 off or Set price. "Basket % off" takes it off everything. "Markdown mode" auto-discounts what you tap.'],
      ['Gift card or loyalty', 'Pay with a gift card: choose Gift card and type the code. Loyalty: type the customer\'s phone in the box before charging — a stamp is added.'],
      ["Today's counts", 'Count shows a few items each day. Type what you actually see and Save. Do not type what you think it should be.'],
      ['Stock arrived', 'Receive: if it was ordered, it is listed under "On the way" — tap Receive. Otherwise find the item and Add the quantity.'],
      ['A maker brought pieces', 'Intake: pick the maker, list the pieces (new ones get a price and category), Log intake. They get an email receipt.'],
      ['Hold something for a customer', 'Shelf > Hold an item for someone. It comes off the shelf count for a week; tap Picked up when they come.'],
      ['Cash drawer', 'Cash: Open drawer with the float at the start of the day. Drop to safe when it gets full. Close and count at the end (or use Close).'],
      ['Close the day', 'Close walks you through it: count the drawer, finish the counts, note anything odd, tap Close the day. Takes three minutes.'],
      ['Something broke or went missing', 'Shelf > Report an incident, or use the chips on the Close screen. A photo helps.'],
      ['Wrong PIN / new phone', 'Settings (⋯) > Forget my PIN, then enter it again. PINs are on the Settings tab of the sheet; the manager PIN is for refunds and payouts.'],
      ['No signal', 'Keep going. Sales save on the phone and sync when the signal is back (a badge shows how many are waiting).'],
      ['The bell', 'The 🔔 in the top bar lists what needs a person today: orders to ship, holds expiring, a day not closed, transfers to approve. Tap "Turn on phone notifications" inside it and urgent things pop up while the app is open.'],
      ['An online order came in', 'Orders lists what to ship. Pack it, tap Mark shipped, type the tracking number — the customer gets the email.'],
      ['Coupons', 'A sale over $20 prints a pizza coupon code on the receipt. When a customer brings a SHOP- code from the pizza counter, tap Basket % off > Coupon code… and type it.'],
      ['The van and the run', 'Van: Load from the shelf before the run, Drop at a site when you get there. The stops show in driving order with a Maps link. Transfers staff request wait there for a manager's Approve.'],
      ['Ask a question', 'Ask: type a plain question (what should I reorder? who is owed the most?) and Claude answers from the sheet. The same screen writes a product description and a social caption for any item.'],
      ['A photo of a new piece', 'On Intake, take the photo for a new piece first — Claude fills in a name, price and category you can change.'],
      ['Scan a barcode', 'Tap the ▤ button next to any search box and point the camera at the code. A USB or Bluetooth scanner works too.']
    ];
    var box = document.createElement('div'); box.className = 'help';
    cards.forEach(function (c) { var d = document.createElement('details'); var s = document.createElement('summary'); s.textContent = c[0]; var p = document.createElement('p'); p.textContent = c[1]; d.appendChild(s); d.appendChild(p); box.appendChild(d); });
    root.appendChild(box);
  }
});
</script>
