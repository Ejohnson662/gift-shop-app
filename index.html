        var phone = App.$('sell-phone').value.replace(/\D/g, '');

<script>
// RECEIVE — open purchase orders first ("Receive all", adjust a line for a short box), then the free-form list.
App.screen({
  id: 'receive', title: 'Receive', order: 30,
  render: function (root) {
    root.innerHTML =
      '<div id="po-list"></div>' +
      '<p class="muted">Something arrived without an order? Tap the item, enter how many came in.</p>' +

      pos.forEach(function (p) {

        g.appendChild(head);
        var inputs = {};
        p.lines.forEach(function (l) {
          if (!l.remaining) return;
          var r = document.createElement('div'); r.style.display = 'flex'; r.style.alignItems = 'center'; r.style.gap = '8px'; r.style.marginTop = '6px';
          var nm = document.createElement('span'); nm.style.flex = '1'; nm.textContent = l.item + ' (' + l.remaining + ' to come)';
          var inp = document.createElement('input'); inp.type = 'number'; inp.className = 'count-in'; inp.value = l.remaining; inp.inputMode = 'numeric'; inp.min = '0';

<script>
// INTAKE — a maker drops off pieces: pick the maker, list what came in (existing or new), everything lands in stock.
App.screen({
  id: 'intake', title: 'Intake', order: 35,
  render: function (root) {
    var self = this; self.pieces = [];
    root.innerHTML =
      '<p class="muted">A maker brought pieces? Pick them, list what came in. New pieces are added to the shelf on consignment and the maker gets an emailed receipt.</p>' +
      '<div class="piece"><div class="two"><input type="text" id="in-maker" placeholder="Maker" list="in-makers"><button class="chip" id="in-pick">Pick</button></div><datalist id="in-makers"></datalist>' +
      '<div class="two"><input type="email" id="in-email" placeholder="Email (for the receipt)"><input type="number" id="in-pct" placeholder="Their %" inputmode="numeric" min="0" max="100"></div></div>' +
      '<div id="in-pieces"></div>' +
      '<div class="chips" style="margin-top:8px"><button class="chip" id="in-add-existing">+ Existing item</button><button class="chip" id="in-add-new">+ New piece</button></div>' +
      '<button class="btn" id="in-save" style="margin-top:10px">Log intake</button>' +
      '<div id="in-expiring"></div>';
    App.$('in-pick').onclick = function () { App.call('api_makers').then(function (names) { App.choose('Which maker?', names.length ? names : ['(none yet — type a name)'], App.$('in-maker').value, function (n) { if (n[0] !== '(') App.$('in-maker').value = n; }); }).catch(function (e) { App.toast(e.message || String(e), true); }); };
    App.$('in-add-existing').onclick = function () { self.pieces.push({ kind: 'existing' }); self.renderPieces(); };
    App.$('in-add-new').onclick = function () { self.pieces.push({ kind: 'new' }); self.renderPieces(); };
    App.$('in-save').onclick = function () { self.save(); };
  },
  onData: function (d) {
    var dl = App.$('in-makers'); dl.innerHTML = '';
    var seen = {};
    (d.items || []).forEach(function (i) { if (i.consign && i.vendor && !seen[i.vendor]) { seen[i.vendor] = 1; var o = document.createElement('option'); o.value = i.vendor; dl.appendChild(o); } });
    var ex = App.$('in-expiring'); ex.innerHTML = '';
    if (d.expiring && d.expiring.length) {
      var h = document.createElement('h3'); h.textContent = 'Best-by dates coming up'; h.style.margin = '18px 0 6px'; ex.appendChild(h);
      d.expiring.forEach(function (x) { var r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<div class="name"><b></b><span></span></div>'; r.querySelector('b').textContent = x.item; r.querySelector('span').textContent = (x.daysLeft < 0 ? 'expired ' : x.daysLeft + ' days · ') + x.onHand + ' on hand · ' + x.markdown; ex.appendChild(r); });
    }
  },
  renderPieces: function () {
    var self = this, box = App.$('in-pieces'); box.innerHTML = '';
    self.pieces.forEach(function (p, idx) {
      var d = document.createElement('div'); d.className = 'piece';
      if (p.kind === 'existing') {
        d.innerHTML = '<div class="three"><input type="text" placeholder="Item name or SKU" list="in-items"><input type="number" placeholder="Qty" inputmode="numeric" min="1"><button class="chip">✕</button></div><datalist id="in-items"></datalist>';
        var dl = d.querySelector('datalist'); App.items().forEach(function (i) { var o = document.createElement('option'); o.value = i.item; dl.appendChild(o); });
        var ins = d.querySelectorAll('input'); ins[0].value = p.name || ''; ins[1].value = p.qty || '';
        ins[0].oninput = function () { p.name = ins[0].value; }; ins[1].oninput = function () { p.qty = ins[1].value; };
      } else {
        d.innerHTML = '<div class="two"><input type="text" placeholder="New piece name"><input type="number" placeholder="Price $" inputmode="decimal" step="0.5" min="0"></div>' +
          '<div class="three"><select></select><input type="number" placeholder="Qty" inputmode="numeric" min="1"><button class="chip">✕</button></div>' +
          '<input type="file" accept="image/*" capture="environment">';
        var sel = d.querySelector('select'); ['Local crafts', 'Maine-made food', 'Apparel & hats', 'Kids & toys', 'Home & kitchen', 'Candles & soap', 'Cards & stationery', 'Other'].forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
        var ins2 = d.querySelectorAll('input');
        ins2[0].value = p.name || ''; ins2[1].value = p.price || ''; ins2[2].value = p.qty || ''; sel.value = p.cat || 'Local crafts';
        ins2[0].oninput = function () { p.name = ins2[0].value; }; ins2[1].oninput = function () { p.price = ins2[1].value; }; ins2[2].oninput = function () { p.qty = ins2[2].value; }; sel.onchange = function () { p.cat = sel.value; };
        ins2[3].onchange = function () { p.file = ins2[3].files[0]; };
      }
      d.querySelector('button.chip').onclick = function () { self.pieces.splice(idx, 1); self.renderPieces(); };
      box.appendChild(d);
    });
  },
  shrinkPhoto: function (file) {
    return new Promise(function (resolve) {
      var img = new Image(); var url = URL.createObjectURL(file);
      img.onload = function () { var s = Math.min(1, 800 / Math.max(img.width, img.height)); var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82).split(',')[1]); };
      img.onerror = function () { resolve(null); };
      img.src = url;
    });
  },
  save: function () {
    var self = this;
    var maker = App.$('in-maker').value.trim(); if (!maker) return App.toast('Whose pieces are these?', true);
    if (!self.pieces.length) return App.toast('Add at least one piece', true);

      var p = self.pieces[i];

      else pieces.push({ name: p.name, price: Number(p.price), cat: p.cat || 'Local crafts', qty: Number(p.qty) });

      var uploads = [];
      self.pieces.forEach(function (p, idx) { if (p.kind === 'new' && p.file && r.skus[idx]) uploads.push(self.shrinkPhoto(p.file).then(function (b64) { if (b64) return App.call('api_uploadPhoto', [App.pin, r.skus[idx], b64, 'image/jpeg']); })); });
      Promise.all(uploads).then(function () { if (uploads.length) App.toast('Photos saved'); App.load(); }).catch(function (e) { App.toast('Photo upload failed: ' + (e.message || e), true); App.load(); });
      self.pieces = []; self.renderPieces(); App.$('in-email').value = ''; App.$('in-pct').value = '';
      App.emit('receipt', r);
    }).catch(function (e) { b.disabled = false; b.textContent = 'Log intake'; App.pinFailed(e); });
  }
});
App.mock.api_makers = function () { return ['Tides & Threads (Sarah)', 'Maine Balsam Fill']; };
App.mock.api_intake = function (p, o) { return { maker: o.maker, pct: 60, skus: o.pieces.map(function (x, i) { return x.sku || 'CN-TT-' + (i + 1); }), lines: o.pieces.map(function (x) { return { sku: x.sku || 'CN', item: x.name || x.sku, qty: x.qty, price: x.price || 0 }; }), receiptSent: !!o.email }; };
App.mock.api_uploadPhoto = function () { return { url: '' }; };
</script>

    App.$('cu-bal').onclick = function () { App.call('api_giftCardBalance', [App.$('cu-code').value]).then(function (c) { App.$('cu-card').textContent = c.code + ': ' + App.money(c.balance) + ' left of ' + App.money(c.amount) + ' · ' + c.status; }).catch(function (e) { App.toast(e.message || String(e), true); }); };
    App.$('cu-issue').onclick = function () {
      var a = Number(App.$('cu-amount').value); if (!(a > 0)) return App.toast('Amount?', true);
      if (!App.needPin()) return;
      var buyer = prompt('Buyer name (optional)') || '';
      App.call('api_issueGiftCard', [App.pin, a, buyer]).then(function (r) { App.$('cu-amount').value = ''; App.$('cu-card').textContent = 'Sold ' + r.code + ' for ' + App.money(r.amount) + '. Write the code on the card.'; App.toast('Gift card ' + r.code); App.emit('sale', { total: r.amount, grand: r.amount, items: ['Gift card'] }); }).catch(App.pinFailed);
    };
  },
  onShow: function () {
    App.call('api_newThisWeek').then(function (n) {
      var box = App.$('cu-post'); box.innerHTML = '';
      if (!n.items.length) { box.textContent = 'Nothing new received in the last 7 days.'; return; }
      var t = document.createElement('div'); t.style.whiteSpace = 'pre-wrap'; t.style.color = 'var(--ink)'; t.textContent = n.instagram; box.appendChild(t);
      var b = document.createElement('button'); b.className = 'btn ghost sm'; b.style.marginTop = '8px'; b.textContent = navigator.share ? 'Share' : 'Copy';
      b.onclick = function () { if (navigator.share) navigator.share({ text: n.instagram }).catch(function () {}); else prompt('Copy this', n.instagram); };
      box.appendChild(b);
    }).catch(function (e) { App.$('cu-post').textContent = e.message || String(e); });
  }
});

<style>
  .form { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; display:grid; gap:8px; margin-bottom:12px; }
  .form .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .money-grid b { font-variant-numeric:tabular-nums; }
</style>
<script>
// MONEY — quick-add an expense, see the month, and what you actually made.
App.screen({
  id: 'money', title: 'Money', order: 60,
  render: function (root) {
    var self = this;
    root.innerHTML =
      '<div class="form">' +
        '<div class="two"><input type="number" id="ex-amount" placeholder="Amount $" inputmode="decimal" step="0.01" min="0"><select id="ex-cat"></select></div>' +
        '<input type="text" id="ex-paid" placeholder="Paid to (optional)">' +
        '<input type="text" id="ex-note" placeholder="What for (optional)">' +
        '<button class="btn" id="ex-save">Add expense</button>' +
      '</div>' +
      '<div id="ex-month"></div>' +
      '<h3 style="margin:16px 0 6px">What you actually made</h3><div class="money-grid" id="money-grid"></div>' +
      '<div class="list" id="ex-list"></div>';
    ['bags & tags', 'fixtures', 'insurance', 'fees', 'marketing', 'supplies', 'other'].forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c; App.$('ex-cat').appendChild(o); });
    App.$('ex-save').onclick = function () {
      var amt = Number(App.$('ex-amount').value); if (!(amt > 0)) return App.toast('How much?', true);
      if (!App.needPin()) return;
      var b = App.$('ex-save'); b.disabled = true;
      App.call('api_expense', [App.pin, { amount: amt, category: App.$('ex-cat').value, paidTo: App.$('ex-paid').value, note: App.$('ex-note').value, who: App.staff }]).then(function (r) {
        b.disabled = false; App.$('ex-amount').value = ''; App.$('ex-paid').value = ''; App.$('ex-note').value = '';
        App.toast('Added ' + App.money(r.amount) + ' · ' + r.category); App.emit('expense', r); self.refresh();
      }).catch(function (e) { b.disabled = false; App.pinFailed(e); });
    };
  },
  onShow: function () { this.refresh(); },
  refresh: function () {
    App.call('api_expenses').then(function (E) {
      var box = App.$('ex-month'); box.innerHTML = '';
      var h = document.createElement('div'); h.className = 'muted'; h.textContent = E.month + ': ' + App.money(E.total) + ' in expenses' + (Object.keys(E.byCategory).length ? ' — ' + Object.keys(E.byCategory).map(function (c) { return c + ' ' + App.money(E.byCategory[c]); }).join(', ') : ''); box.appendChild(h);
      var list = App.$('ex-list'); list.innerHTML = '';
      E.rows.forEach(function (r) { var d = document.createElement('div'); d.className = 'row'; d.innerHTML = '<div class="name"><b></b><span></span></div><div class="price"></div>'; d.querySelector('b').textContent = r.category + (r.paidTo ? ' · ' + r.paidTo : ''); d.querySelector('span').textContent = r.date + (r.note ? ' · ' + r.note : '') + (r.who ? ' · ' + r.who : ''); d.querySelector('.price').textContent = App.money(r.amount); list.appendChild(d); });
    }).catch(function (e) { App.toast(e.message || String(e), true); });
    App.call('api_money').then(function (M) {
      var g = App.$('money-grid'); g.innerHTML = '';
      var add = function (a, b, c, d, strong) { [a, b, c, d].forEach(function (v, i) { var el = document.createElement(strong || i === 0 ? 'b' : 'span'); el.textContent = v; g.appendChild(el); }); };
      add('', 'This month', 'Last month', '90 days');
      [['Sales', 'sales'], ['Cost of goods', 'cogs'], ['Host share', 'hostShare'], ["Makers' share", 'makerShare'], ['Expenses', 'expenses'], ['Net profit', 'net']].forEach(function (l) { add(l[0], App.money(M.thisMonth[l[1]]), App.money(M.lastMonth[l[1]]), App.money(M.d90[l[1]]), l[1] === 'net'); });
      add('Owed to ' + M.owed.host.name, App.money(M.owed.host.owed), '', '');
      M.owed.makers.forEach(function (m) { add('Owed to ' + m.name, App.money(m.owed), '', ''); });
    }).catch(function (e) { App.toast(e.message || String(e), true); });
  }
});
